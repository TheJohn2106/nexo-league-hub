# PostgreSQL local de développement uniquement (mot de passe de démonstration).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nexo_hub
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nexo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo_hub"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  nexo_data:
